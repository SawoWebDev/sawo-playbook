name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API test image
        run: docker compose --profile test build api-test
      - name: Run API test suite (cross-tenant + immutability gates, §17)
        run: docker compose --profile test run --rm api-test
      - name: Tear down
        if: always()
        run: docker compose --profile test down -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
