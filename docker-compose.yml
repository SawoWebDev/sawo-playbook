name: sawo-playbook

# Three containers: db + api + web. Uploads live on the `uploads` volume, background
# cleanup runs inside the API, and emails are logged unless SMTP_URL is set.
x-api-env: &api-env
  NODE_ENV: development
  PORT: 4000
  DATABASE_URL: postgresql://gemba:gemba@db:5432/gembadocs?schema=public
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me}
  JWT_ACCESS_TTL_SECONDS: 900
  REFRESH_TTL_DAYS: 30
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
  KANBAN_VIDEO_URL: ${KANBAN_VIDEO_URL:-}
  STORAGE_DIR: /data/uploads
  PRISMA_HIDE_UPDATE_MESSAGE: "1"
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: SAWO Playbook <no-reply@sawo-playbook.local>

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gemba
      POSTGRES_PASSWORD: gemba
      POSTGRES_DB: gembadocs
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["${PLAYBOOK_DB_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemba -d gembadocs"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
      target: dev
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
      - uploads:/data/uploads
    ports: ["${PLAYBOOK_API_PORT:-4000}:4000"]

  web:
    build:
      context: ./apps/web
      target: dev
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    depends_on: [api]
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports: ["${PLAYBOOK_WEB_PORT:-3000}:3000"]

  # Test runner: `docker compose --profile test run --rm api-test`
  api-test:
    profiles: ["test"]
    build:
      context: ./apps/api
      target: dev
    environment:
      <<: *api-env
      NODE_ENV: test
      DATABASE_URL: postgresql://gemba:gemba@db:5432/gembadocs_test?schema=public
      STORAGE_DIR: /tmp/playbook-test-uploads
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install --no-audit --no-fund --loglevel=error && npx prisma generate >/dev/null && npx prisma migrate deploy && npm test -- $${TEST_ARGS:-}"]

  # Browser tests (optional): production build of the web app + Playwright. Invitation emails are
  # read from Mailpit, which only exists in this profile:
  #   SMTP_URL=smtp://mailpit:1025 docker compose --profile e2e up -d --build api web-e2e mailpit
  #   docker compose --profile e2e run --rm e2e
  mailpit:
    profiles: ["e2e"]
    image: axllent/mailpit:v1.27

  web-e2e:
    profiles: ["e2e"]
    build:
      context: ./apps/web
      target: prod
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]

  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /e2e
    ipc: host
    environment:
      BASE_URL: http://web-e2e:3000
      MAILPIT_URL: http://mailpit:8025
      CI: ${CI:-}
      E2E_REVIEW: ${E2E_REVIEW:-}
    volumes:
      - ./e2e:/e2e
      - e2e_node_modules:/e2e/node_modules
    depends_on: [web-e2e, api, mailpit]
    command: ["sh", "-c", "npm ci --no-audit --no-fund --loglevel=error && npx playwright test $${E2E_ARGS:-}"]

volumes:
  # Pinned to the volume names created under the old compose project name so existing data is kept.
  pgdata:
    name: gembadocs_pgdata
  uploads:
    name: gembadocs_uploads
  api_node_modules:
  web_node_modules:
  web_next:
  e2e_node_modules:
