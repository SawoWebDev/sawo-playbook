# Production-style stack (3 containers): compiled images, no bind mounts, DB not exposed.
#   cp .env.example .env   # set real secrets first
#   docker compose -f docker-compose.prod.yml up -d --build
name: gembadocs-prod

x-api-env: &api-env
  NODE_ENV: production
  PORT: 4000
  DATABASE_URL: postgresql://${POSTGRES_USER:-gemba}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/gembadocs?schema=public
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
  JWT_ACCESS_TTL_SECONDS: 900
  REFRESH_TTL_DAYS: 30
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  WEB_ORIGIN: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL}
  KANBAN_VIDEO_URL: ${KANBAN_VIDEO_URL:-}
  STORAGE_DIR: /data/uploads
  PRISMA_HIDE_UPDATE_MESSAGE: "1"
  SMTP_URL: ${SMTP_URL:?set SMTP_URL, e.g. smtps://user:pass@smtp.example.com:465}
  MAIL_FROM: ${MAIL_FROM:-GembaDocs <no-reply@example.com>}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gemba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gembadocs
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gemba} -d gembadocs"]
      interval: 5s
      retries: 20

  api:
    build: { context: ./apps/api, target: prod }
    restart: unless-stopped
    environment: *api-env
    volumes: [uploads:/data/uploads]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ./apps/web
      target: prod
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]
    ports: ["${GEMBA_WEB_PORT:-3000}:3000"]

volumes:
  pgdata:
  uploads:
