# Production-style stack: compiled images, no bind mounts, no public DB/Redis/MinIO ports.
#   cp .env.example .env   # set real secrets first
#   docker compose -f docker-compose.prod.yml up -d --build
name: gembadocs-prod

x-api-env: &api-env
  NODE_ENV: production
  PORT: 4000
  DATABASE_URL: postgresql://${POSTGRES_USER:-gemba}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/gembadocs?schema=public
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
  JWT_ACCESS_TTL_SECONDS: 900
  REFRESH_TTL_DAYS: 30
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  WEB_ORIGIN: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT}
  S3_REGION: us-east-1
  S3_BUCKET: gembadocs
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  PDF_RENDERER_URL: http://gotenberg:3000
  CLAMAV_HOST: clamav
  PRISMA_HIDE_UPDATE_MESSAGE: "1"
  SMTP_URL: ${SMTP_URL:?set SMTP_URL, e.g. smtps://user:pass@smtp.example.com:465}
  MAIL_FROM: ${MAIL_FROM:-GembaDocs <no-reply@example.com>}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gemba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gembadocs
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gemba} -d gembadocs"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [miniodata:/data]
    # Browsers load media through signed URLs: expose 9000 behind your TLS proxy as S3_PUBLIC_ENDPOINT.
    ports: ["${GEMBA_MINIO_PORT:-9000}:9000"]

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes: [clamdb:/var/lib/clamav]

  api:
    build: { context: ./apps/api, target: prod }
    restart: unless-stopped
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ./apps/api, target: prod }
    restart: unless-stopped
    environment: *api-env
    command: ["node", "dist/worker.js"]
    depends_on:
      api: { condition: service_started }

  web:
    build:
      context: ./apps/web
      target: prod
      args:
        API_INTERNAL_URL: http://api:4000
        MEDIA_ORIGIN: ${S3_PUBLIC_ENDPOINT}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]
    ports: ["${GEMBA_WEB_PORT:-3000}:3000"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  clamdb:
